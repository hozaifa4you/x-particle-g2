[project]
name = "x-particle-g2"
version = "0.2.0"
description = "Conservative AI forex trader: LangGraph agent over a type-safe mt5-wrapper client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.11",
    "mt5-wrapper>=1.0.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.2.3",
    "structlog>=25.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
